name: Terraform Apply

# Runs on the in-cluster conti-points-board-runner (ci-deploy ServiceAccount).
# Terraform runs directly in the runner container, so the kubernetes provider +
# backend authenticate via in-cluster config -- no credentials or kubeconfig
# needed.

on:
  push:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/terraform-apply.yml"

permissions:
  contents: read

concurrency:
  group: terraform-conti-points-board-apply
  cancel-in-progress: false

jobs:
  apply:
    runs-on: conti-points-board-runner
    defaults:
      run:
        working-directory: infra
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Apply
        run: terraform apply -input=false -auto-approve
